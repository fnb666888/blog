<button
  class="toc-desktop-toggle"
  type="button"
  aria-expanded="true"
  aria-controls="toc"
  aria-label="收起目录"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M15 18l-6-6 6-6" />
  </svg>
</button>

<div class="page-links">
  <h3>目录</h3>
  {{ if eq site.Params.doks.scrollSpy true -}}
    {{ .TableOfContents | replaceRE "<nav id=\"TableOfContents\">" "<nav id=\"toc\">" | safeHTML -}}
  {{- else -}}
    {{ .TableOfContents -}}
  {{- end }}
</div>
