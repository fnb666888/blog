<button
  class="toc-mobile-toggle d-xl-none"
  type="button"
  aria-label="打开文章目录"
  aria-expanded="false"
  aria-controls="toc-mobile-panel"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="22"
    height="22"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M4 6h16" />
    <path d="M4 12h10" />
    <path d="M4 18h14" />
  </svg>
</button>

<div class="toc-mobile-backdrop d-xl-none" aria-hidden="true"></div>

<section
  class="toc-mobile-panel d-xl-none"
  id="toc-mobile-panel"
  role="dialog"
  aria-modal="true"
  aria-label="文章目录"
  aria-hidden="true"
>
  <header class="toc-mobile-panel__header">
    <span class="toc-mobile-panel__title">目录</span>
    <button class="toc-mobile-panel__close" type="button" aria-label="关闭目录">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  </header>
  <div class="page-links">
    {{ .TableOfContents }}
  </div>
</section>
